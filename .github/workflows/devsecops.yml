name: DevSecOps-Pipeline

on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy SCA scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app/'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      # 2. Загружаем результаты в DefectDojo
      - name: Upload results to DefectDojo
        if: always()
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
        run: |
          # 1. Формируем дату для импорта (как в инструкции)
          TODAY=$(date +%Y-%m-%d)
          
          # 2. Очищаем URL от возможных слешей в конце
          CLEAN_URL="${DD_URL%/}"
          
          # 3. Выполняем загрузку, используя --insecure и правильные флаги формы
          curl --insecure --fail --location --request POST "${CLEAN_URL}/import-scan/" \
            --header "Authorization: Token ${DD_TOKEN}" \
            --form "scan_date=${TODAY}" \
            --form "minimum_severity=Info" \
            --form "active=true" \
            --form "verified=true" \
            --form "scan_type=Trivy Scan" \
            --form "product_id=${{ secrets.DEFECTDOJO_PRODUCT_ID }}" \
            --form "engagement_name=GitHub-Scan-${{ github.run_id }}" \
            --form "file=@trivy-results.json" \
            --form "close_old_findings=true" \
            --header "ngrok-skip-browser-warning: true"



name: Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Решаем проблему с Node.js сразу для всех задач
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        # Используем проверку напрямую через бинарник, чтобы избежать проблем с 'args'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # В v2 вместо 'args' настройки часто передаются через конфиг-файл, 
        # но мы можем просто убедиться, что он видит весь репозиторий

  sast-scan:
    runs-on: ubuntu-latest
    needs: secret-detection
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          # Мы используем 'auto', чтобы Semgrep сам подобрал правила на основе кода,
          # И добавляем конкретные рабочие сеты для Python
          config: >-
            p/python
            p/flask
            p/security-audit
          # Добавляем флаг, чтобы пайплайн падал при нахождении ошибок (Exit Code 1)
          auditOnInvalidConfig: true
        env:
          # Убираем лишние ворнинги Node.js и заставляем его быть строгим
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: api
        image: app:latest
        securityContext:
          privileged: true
          runAsUser: 0
        ports:
        - containerPort: 5000